<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Solicitar Turno</title>
	<link rel="stylesheet" href="../css/styles.css">
	<script src="../js/scripts.js" defer></script>
</head>

<body>

	<header>
		<img src="../images/logo_robado.png" alt="Logo Clínica SaludTotal">
		<h1>Portal del Paciente</h1>
		<p>Clínica SaludTotal</p>
		<h3 id="bienvenida">Bienvenido paciente</h3>
	</header>

	<nav>
		<ul>
			<li><a href="../index.html">Inicio</a></li>
			<li class="paciente"><a href="mis-turnos.html">Mis Turnos</a></li>
			<li class="paciente"><a href="historial.html">Historial Clínico</a></li>
			<li class="paciente"><a href="resultados.html">Resultados</a></li>
			<li class="visitante paciente"><a href="solicitar-turno.html">Solicitar Turno</a></li>
			<li class="visitante"><a href="signup.html">Crear usuario</a></li>
			<li class="visitante"><a href="login.html">Iniciar sesión</a></li>
			<li class="admin"><a href="statistics.html">Estadisticas</a></li>
			<li class="admin paciente"><a href="login.html" onclick="desconectar()"> Desconectar </a></li>
		</ul>
	</nav>

	<main>

		<section>

			<h2>Solicitar un nuevo turno</h2>

			<form id="form-turno">

				<p>
					<label for="especialidad">Especialidad</label><br>
					<select id="especialidad" name="especialidad">
						<option>Clínica Médica</option>
						<option>Cardiología</option>
						<option>Pediatría</option>
						<option>Traumatología</option>
					</select>
				</p>

				<p>
					<label for="medico">Médico</label><br>
					<select id="medico" name="medico">
						<option>Dra. Gómez</option>
						<option>Dr. Pérez</option>
						<option>Dra. Fernández</option>
					</select>
				</p>

				<p>
					<label for="fecha">Fecha</label><br>
					<input type="date" id="fecha">
				</p>

				<p>
					<label for="hora">Horario</label><br>
					<select id="hora">
						<option>09:00</option>
						<option>10:00</option>
						<option>11:30</option>
						<option>15:00</option>
					</select>
				</p>

				<p>
					<input type="submit" value="Solicitar Turno">
				</p>

			</form>

		</section>

	</main>

	<footer>
		<p>© 2026 Clínica SaludTotal</p>
	</footer>

</body>

</html>
